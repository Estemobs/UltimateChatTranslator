name: Cleanup CurseForge

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and delete old CurseForge files
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          API="https://api.curseforge.com/v1"
          MOD_ID="1623505"

          fetch_page() {
            curl -s "$API/mods/$MOD_ID/files?pageSize=50&pageIndex=$1" \
              -H "x-api-key: $CF_TOKEN" -H "Accept: application/json"
          }

          all_files=$(
            for page in 0 1 2 3; do
              fetch_page $page | python3 -c "import json,sys; d=json.load(sys.stdin)
for f in d.get('data',[]):
    print(f['id'], '|', f.get('displayName',''), '|', f.get('fileName',''))
" 2>/dev/null
            done
          )

          echo "=== All files on CurseForge ==="
          echo "$all_files"
          echo ""

          KEEP_COUNT=0
          DELETE_LIST=""

          while IFS='|' read -r fid name fname; do
            fid=$(echo "$fid" | xargs)
            name=$(echo "$name" | xargs)

            if echo "$name" | grep -q "^ultimate-chat-translator-"; then
              KEEP_COUNT=$((KEEP_COUNT + 1))
              echo "KEEP [$fid] $name"
              continue
            fi

            DELETE_LIST="$DELETE_LIST $fid"
            echo "DELETE [$fid] $name"
          done <<< "$all_files"

          echo ""
          echo "=== Deleting old files ==="
          for fid in $DELETE_LIST; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              "$API/mods/$MOD_ID/files/$fid" \
              -H "x-api-key: $CF_TOKEN" -H "Accept: application/json")
            echo "  Delete file $fid: HTTP $code"
          done