name: Test Mod

on:
  push:
    branches:
      - main
      - copilot/add-github-action-for-release
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.5"

      - name: Run tests
        run: |
          for attempt in 1 2 3; do
            gradle test && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "gradle test failed (attempt $attempt), retrying after dependency-resolution hiccup..."
            sleep $((attempt * 15))
          done