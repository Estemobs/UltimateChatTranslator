name: Build and Release JAR

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft version (1.20.1, 1.21.1, 1.21.4, 1.21.8)'
        required: true
        default: '1.21.1'
      version:
        description: 'Mod version (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Parse MC version and build tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MC_VER="${{ inputs.mc_version }}"
            VERSION="${{ inputs.version }}"
            echo "TAG=v${VERSION}-mc${MC_VER}" >> $GITHUB_ENV
          else
            TAG="${{ github.ref_name }}"
            MC_VER="${TAG##*-mc}"
            if [ "$MC_VER" = "$TAG" ]; then
              MC_VER="1.21.1"
            fi
            VERSION="${TAG#v}"
            VERSION="${VERSION%%-mc*}"
            echo "TAG=${TAG}" >> $GITHUB_ENV
          fi
          echo "MC_VER=${MC_VER}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "MC version: ${MC_VER}, Version: ${VERSION}"

      - name: Determine branch
        run: |
          if [ "${{ env.MC_VER }}" = "1.21.1" ]; then
            echo "BRANCH=main" >> $GITHUB_ENV
          else
            echo "BRANCH=mc-${{ env.MC_VER }}" >> $GITHUB_ENV
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Determine Gradle version
        run: |
          case "${{ env.MC_VER }}" in
            1.20.1) GRADLE_VER="8.8" ;;
            1.21.1) GRADLE_VER="8.8" ;;
            1.21.4) GRADLE_VER="8.11" ;;
            1.21.8) GRADLE_VER="8.12" ;;
            *)      GRADLE_VER="8.8" ;;
          esac
          echo "GRADLE_VER=${GRADLE_VER}" >> $GITHUB_ENV

      - name: Setup Gradle ${{ env.GRADLE_VER }}
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VER }}

      - name: Set version from tag
        run: |
          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
          echo "Version: ${VERSION}"

      - name: Create tag if missing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ env.TAG }}" >/dev/null 2>&1; then
            git tag -a "${{ env.TAG }}" -m "Ultimate Chat Translator v${{ env.VERSION }} (MC ${{ env.MC_VER }})"
            echo "Created tag ${{ env.TAG }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Ultimate Chat Translator ${{ env.VERSION }} (MC ${{ env.MC_VER }})"
          body: "See [CHANGELOG](CHANGELOG.md) for details."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          for attempt in 1 2 3; do
            gradle clean build && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Build failed (attempt $attempt), retrying..."
            sleep $((attempt * 15))
          done

      - name: Upload artifacts to release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-tag: "${{ env.TAG }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"

          modrinth-id: "ultimatechattranslator"
          modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"

          name: "Ultimate Chat Translator ${{ env.VERSION }} (MC ${{ env.MC_VER }})"
          version: "${{ env.VERSION }}+mc${{ env.MC_VER }}"
          version-type: release
          changelog-file: CHANGELOG.md

          github-files: "build/libs/!(*-@(dev|sources|javadoc)).jar"

          files: "build/libs/!(*-@(dev|sources|javadoc)).jar"
