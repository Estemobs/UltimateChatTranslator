name: Build and Release JAR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft version (1.20.1, 1.21.1, 1.21.4, 1.21.8)'
        required: true
        default: '1.21.1'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Parse MC version
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          MC_VER="${TAG##*-mc}"
          if [ "$MC_VER" = "$TAG" ]; then
            MC_VER="1.21.1"
          fi
          echo "MC_VER=${MC_VER}" >> $GITHUB_ENV
          echo "MC version: ${MC_VER}"

      - name: Determine branch
        run: |
          if [ "${{ env.MC_VER }}" = "1.21.1" ]; then
            echo "BRANCH=main" >> $GITHUB_ENV
          else
            echo "BRANCH=mc-${{ env.MC_VER }}" >> $GITHUB_ENV
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Determine Gradle version
        run: |
          case "${{ env.MC_VER }}" in
            1.20.1) GRADLE_VER="8.8" ;;
            1.21.1) GRADLE_VER="8.8" ;;
            1.21.4) GRADLE_VER="8.11" ;;
            1.21.8) GRADLE_VER="8.12" ;;
            *)      GRADLE_VER="8.8" ;;
          esac
          echo "GRADLE_VER=${GRADLE_VER}" >> $GITHUB_ENV

      - name: Setup Gradle ${{ env.GRADLE_VER }}
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VER }}

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-mc*}"
          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Version: ${VERSION}"

      - name: Build
        run: |
          for attempt in 1 2 3; do
            gradle clean build && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Build failed (attempt $attempt), retrying..."
            sleep $((attempt * 15))
          done

      - name: Check for existing CurseForge upload
        id: check_cf
        run: |
          MARKER="<!-- cf-uploaded -->"
          BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('body',''))")
          if echo "$BODY" | grep -q "$MARKER"; then
            echo "CurseForge upload already done for this release. Skipping."
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Publish to CurseForge & GitHub
        id: publish
        if: env.skip != 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1623505
          curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

          github-tag: "${{ github.ref_name }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"

          curseforge-files: "build/libs/!(*-@(dev|sources|javadoc)).jar"

          name: "ultimate-chat-translator-${{ env.VERSION }}"
          version: "${{ env.VERSION }}+mc${{ env.MC_VER }}"
          version-type: release
          changelog-file: CHANGELOG.md

          game-versions: "${{ env.MC_VER }}"
          loaders: fabric
          java: Java 21

          dependencies: |
            fabric-api(required)
            modmenu(optional)

      - name: Mark release as uploaded
        if: steps.publish.outcome == 'success'
        run: |
          python3 -c "
import json, os, urllib.request
token = os.environ['GITHUB_TOKEN']
repo = os.environ['GITHUB_REPOSITORY']
tag = os.environ['GITHUB_REF_NAME']

req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}',
    headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github.v3+json'})
with urllib.request.urlopen(req) as r:
    rel = json.load(r)
rid = rel['id']
body = rel.get('body', '') or ''

MARKER = '<!-- cf-uploaded -->'
if MARKER in body:
    exit(0)

new_body = body + '\n' + MARKER
data = json.dumps({'body': new_body}).encode()
req2 = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/{rid}',
    data=data, method='PATCH',
    headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json',
             'Accept': 'application/vnd.github.v3+json'})
with urllib.request.urlopen(req2) as r:
    print(f'Marked release {rid} as uploaded')
"
