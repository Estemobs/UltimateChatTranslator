name: Build and Release JAR

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build
        run: |
          for attempt in 1 2 3; do
            gradle build && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "gradle build failed (attempt $attempt), retrying after dependency-resolution hiccup..."
            sleep $((attempt * 15))
          done

      - name: Publish to CurseForge & GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1623505
          curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

          github-tag: "${{ github.ref_name }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"

          curseforge-files: "build/libs/!(*-@(dev|sources|javadoc)).jar"

          name: "Ultimate Chat Translator ${{ env.VERSION }}"
          version: "${{ env.VERSION }}"
          version-type: release
          changelog-file: CHANGELOG.md

          loaders: fabric
          java: Java 21

          dependencies: |
            fabric-api(required)
            modmenu(optional)
